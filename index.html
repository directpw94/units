<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стоматологічна установка KLT 6220 A3</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f4f6f8; color: #222; }
  h1 { font-size: 22px; text-align: center; }
  h2 { max-width: 1000px; margin: 24px auto 12px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; max-width: 1000px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .card:target { outline: 3px solid #2a7de1; }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; background: #eee; cursor: pointer; display: block; }
  .code { margin: 8px 0; font-weight: bold; text-align: center; }
  .gift { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; margin-top: 4px; }
  .qty { font-weight: bold; }
  .out img { filter: grayscale(1); opacity: .6; }
  .msg { max-width: 1000px; margin: 0 auto; color: #666; text-align: center; }
  #viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); align-items: center; justify-content: center; z-index: 10; }
  #viewer img { max-width: 95%; max-height: 95%; border-radius: 8px; }
</style>
</head>
<body>
<h1>Стоматологічна установка KLT 6220 A3</h1>

<h2>✅ В наявності</h2>
<div class="grid" id="gridIn"></div>

<h2>❌ Немає в наявності</h2>
<div class="grid" id="gridOut"></div>

<div class="msg" id="msg">Завантаження...</div>

<div id="viewer"><img alt=""></div>

<script>
  var TOTAL = 21;
  var SHEET_ID = '1K6x-_NK_KGnS7ssoMqQGN4pOUBnbEcOd3_xaRcHGQ50';
  var UNIT_ARTICLES = ['KLT 6220 A3 L', 'KLT 6220 A3 T'];
  var SWAP_ARTICLE = 'RV103-3 SH LE';

  var data = {};
  var ready = false;
  var cards = {};
  var codes = [];
  var gridIn = document.getElementById('gridIn');
  var gridOut = document.getElementById('gridOut');
  var viewer = document.getElementById('viewer');
  var big = viewer.querySelector('img');
  viewer.onclick = function () { viewer.style.display = 'none'; };

  function sheetUrl(name) {
    return 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(name);
  }

  function parseCSV(text) {
    var rows = [], row = [], field = '', inQ = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQ) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQ = false; }
        } else { field += ch; }
      } else if (ch === '"') { inQ = true; }
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (ch !== '\r') { field += ch; }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function norm(s) { return (s || '').replace(/\s+/g, ' ').trim().toUpperCase(); }
  function colorCode(s) { return (s || '').replace(/\s+/g, '').toUpperCase(); }
  function toNum(s) {
    var n = parseFloat((s || '').replace(/\s/g, '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }
  function mark(v) { return v ? '✅' : '❌'; }

  function fetchSheet(name) {
    return fetch(sheetUrl(name)).then(function (r) {
      if (!r.ok) throw new Error(name);
      return r.text();
    }).then(parseCSV);
  }

  function entry(code) {
    if (!data[code]) data[code] = { color: 0, chairs: 0, pillows: 0 };
    return data[code];
  }

  function kits(d) {
    return Math.min(d.color, d.chairs, d.pillows);
  }

  function collect(unitRows, swapRows) {
    data = {};
    unitRows.slice(1).forEach(function (r) {
      if (UNIT_ARTICLES.indexOf(norm(r[1])) === -1) return;
      if ((r[15] || '').trim() !== '1') return;
      var code = colorCode(r[3]);
      if (!code) return;
      var e = entry(code);
      e.color += 1;
      if ((r[10] || '').trim() === '1') e.chairs += 1;
      if ((r[11] || '').trim() === '1') e.pillows += 1;
    });
    swapRows.slice(1).forEach(function (r) {
      if (norm(r[1]) !== SWAP_ARTICLE) return;
      var q = toNum(r[0]);
      if (q <= 0) return;
      var code = colorCode(r[4]);
      if (!code) return;
      entry(code).color += q;
    });
  }

  function render() {
    codes.forEach(function (code) {
      var c = cards[code];
      var d = data[code] || { color: 0, chairs: 0, pillows: 0 };
      var inStock = d.color > 0;
      c.el.className = 'card' + (inStock ? '' : ' out');
      c.qty.textContent = kits(d);
      c.chair.textContent = mark(d.chairs > 0);
      c.pillows.textContent = mark(d.pillows > 0);
      (inStock ? gridIn : gridOut).appendChild(c.el);
      c.el.style.display = (ready && c.ok) ? 'block' : 'none';
    });
  }

  function row(label) {
    var r = document.createElement('div');
    r.className = 'gift';
    var t = document.createElement('span');
    t.textContent = label;
    var v = document.createElement('span');
    r.appendChild(t);
    r.appendChild(v);
    return { row: r, val: v };
  }

  for (var i = 1; i <= TOTAL; i++) {
    (function (code) {
      codes.push(code);
      var el = document.createElement('div');
      el.className = 'card';
      el.id = code;
      el.style.display = 'none';

      var img = document.createElement('img');
      img.alt = code;
      img.src = 'images/' + code + '.png';
      img.onclick = function () { big.src = img.src; viewer.style.display = 'flex'; };

      var title = document.createElement('div');
      title.className = 'code';
      title.textContent = code;

      var r1 = row('Стілець RS03 у подарунок');
      var r2 = row('Подушки у подарунок');
      var rq = row('Кількість повних комплектів з подушкою та стільцем');
      rq.val.className = 'qty';

      el.appendChild(img);
      el.appendChild(title);
      el.appendChild(r1.row);
      el.appendChild(r2.row);
      el.appendChild(rq.row);
      cards[code] = { el: el, ok: false, qty: rq.val, chair: r1.val, pillows: r2.val };
      gridOut.appendChild(el);

      img.onload = function () {
        cards[code].ok = true;
        render();
        if (ready && location.hash === '#' + code) el.scrollIntoView();
      };
    })('FS' + (i < 10 ? '0' + i : i));
  }

  Promise.all([fetchSheet('Установки'), fetchSheet('Сменные')])
    .then(function (res) {
      collect(res[0], res[1]);
      ready = true;
      document.getElementById('msg').style.display = 'none';
      render();
    })
    .catch(function () {
      document.getElementById('msg').textContent = 'Не вдалося завантажити дані';
    });
</script>
</body>
</html>
