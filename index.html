<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стоматологічна установка KLT 6220 A3</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f4f6f8; color: #222; }
  h1 { font-size: 22px; text-align: center; }
  h2 { max-width: 1000px; margin: 24px auto 12px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; max-width: 1000px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; background: #eee; cursor: pointer; display: block; }
  .code { margin: 8px 0; font-weight: bold; text-align: center; }
  .gift { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; margin-top: 4px; }
  .qty { font-weight: bold; }
  .msg { max-width: 1000px; margin: 0 auto; color: #666; text-align: center; }
  #viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); align-items: center; justify-content: center; z-index: 10; }
  #viewer img { max-width: 95%; max-height: 95%; border-radius: 8px; }
</style>
</head>
<body>
<h1>Стоматологічна установка KLT 6220 A3</h1>

<h2>🦷 Установки в наявності</h2>
<div class="grid" id="gridUnits"></div>
<div class="msg" id="msgUnits">Завантаження...</div>

<h2>🔄 Змінні в наявності</h2>
<div class="grid" id="gridSwap"></div>
<div class="msg" id="msgSwap">Завантаження...</div>

<div id="viewer"><img alt=""></div>

<script>
  var SHEET_ID = '1K6x-_NK_KGnS7ssoMqQGN4pOUBnbEcOd3_xaRcHGQ50';
  var UNIT_ARTICLES = ['KLT 6220 A3 L', 'KLT 6220 A3 T'];
  var SWAP_ARTICLE = 'RV103-3 SH LE';

  var viewer = document.getElementById('viewer');
  var big = viewer.querySelector('img');
  viewer.onclick = function () { viewer.style.display = 'none'; };

  function sheetUrl(name) {
    return 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(name);
  }

  function parseCSV(text) {
    var rows = [], row = [], field = '', inQ = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQ) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQ = false; }
        } else { field += ch; }
      } else if (ch === '"') { inQ = true; }
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (ch !== '\r') { field += ch; }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function norm(s) { return (s || '').replace(/\s+/g, ' ').trim().toUpperCase(); }
  function colorCode(s) { return (s || '').replace(/\s+/g, '').toUpperCase(); }
  function toNum(s) {
    var n = parseFloat((s || '').replace(/\s/g, '').replace(',', '.'));
    return isNaN(n) ? 0 : n;
  }
  function mark(v) { return v ? '✅' : '❌'; }

  function fetchSheet(name) {
    return fetch(sheetUrl(name)).then(function (r) {
      if (!r.ok) throw new Error(name);
      return r.text();
    }).then(parseCSV);
  }

  function row(label, value, cls) {
    var r = document.createElement('div');
    r.className = 'gift';
    var t = document.createElement('span');
    t.textContent = label;
    var v = document.createElement('span');
    v.textContent = value;
    if (cls) v.className = cls;
    r.appendChild(t);
    r.appendChild(v);
    return r;
  }

  function addCard(grid, code, lines) {
    var el = document.createElement('div');
    el.className = 'card';
    el.id = code;
    el.style.display = 'none';
    var img = document.createElement('img');
    img.alt = code;
    img.src = 'images/' + code + '.png';
    img.onclick = function () { big.src = img.src; viewer.style.display = 'flex'; };
    img.onload = function () {
      el.style.display = 'block';
      if (location.hash === '#' + code) el.scrollIntoView();
    };
    var title = document.createElement('div');
    title.className = 'code';
    title.textContent = code;
    el.appendChild(img);
    el.appendChild(title);
    lines.forEach(function (l) { el.appendChild(l); });
    grid.appendChild(el);
  }

  function sortedKeys(obj) { return Object.keys(obj).sort(); }

  function buildUnits(rows) {
    var map = {};
    rows.slice(1).forEach(function (r) {
      if (UNIT_ARTICLES.indexOf(norm(r[1])) === -1) return;
      if ((r[15] || '').trim() !== '1') return;
      var code = colorCode(r[3]);
      if (!code) return;
      if (!map[code]) map[code] = { n: 0, chair: false, pillows: false };
      map[code].n += 1;
      if ((r[10] || '').trim() === '1') map[code].chair = true;
      if ((r[11] || '').trim() === '1') map[code].pillows = true;
    });
    var grid = document.getElementById('gridUnits');
    var keys = sortedKeys(map);
    document.getElementById('msgUnits').textContent = keys.length ? '' : 'Наразі немає в наявності';
    keys.forEach(function (code) {
      var d = map[code];
      addCard(grid, code, [
        row('Стілець RS03 у подарунок', mark(d.chair)),
        row('Подушки у подарунок', mark(d.pillows)),
        row('Кількість', d.n, 'qty')
      ]);
    });
  }

  function buildSwap(rows) {
    var map = {};
    rows.slice(1).forEach(function (r) {
      if (norm(r[1]) !== SWAP_ARTICLE) return;
      var qty = toNum(r[0]);
      if (qty <= 0) return;
      var code = colorCode(r[4]);
      if (!code) return;
      map[code] = (map[code] || 0) + qty;
    });
    var grid = document.getElementById('gridSwap');
    var keys = sortedKeys(map);
    document.getElementById('msgSwap').textContent = keys.length ? '' : 'Наразі немає в наявності';
    keys.forEach(function (code) {
      addCard(grid, code, [row('Кількість', map[code], 'qty')]);
    });
  }

  fetchSheet('Установки').then(buildUnits).catch(function () {
    document.getElementById('msgUnits').textContent = 'Не вдалося завантажити дані';
  });
  fetchSheet('Сменные').then(buildSwap).catch(function () {
    document.getElementById('msgSwap').textContent = 'Не вдалося завантажити дані';
  });
</script>
</body>
</html>
