<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цвета стоматологических установок</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f4f6f8; color: #222; }
  h1 { font-size: 22px; text-align: center; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; max-width: 1000px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .card:target { outline: 3px solid #2a7de1; }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; background: #eee; cursor: pointer; }
  .card div { margin-top: 8px; font-weight: bold; }
  #viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); align-items: center; justify-content: center; z-index: 10; }
  #viewer img { max-width: 95%; max-height: 95%; border-radius: 8px; }
</style>
</head>
<body>
<h1>🦷 Цвета установок</h1>
<div id="gallery"></div>
<div id="viewer"><img alt=""></div>

<script>
  var TOTAL = 21;
  var gallery = document.getElementById('gallery');
  var viewer = document.getElementById('viewer');
  var big = viewer.querySelector('img');

  for (var i = 1; i <= TOTAL; i++) {
    var code = 'FS' + (i < 10 ? '0' + i : i);
    var card = document.createElement('div');
    card.className = 'card';
    card.id = code;
    card.style.display = 'none';
    var img = document.createElement('img');
    img.alt = code;
    img.src = 'images/' + code + '.png';
    img.onload = (function (c) { return function () { c.style.display = 'block'; if (location.hash === '#' + c.id) c.scrollIntoView(); }; })(card);
    img.onclick = (function (im) { return function () { big.src = im.src; viewer.style.display = 'flex'; }; })(img);
    var label = document.createElement('div');
    label.textContent = code;
    card.appendChild(img);
    card.appendChild(label);
    gallery.appendChild(card);
  }

  viewer.onclick = function () { viewer.style.display = 'none'; };
</script>
</body>
</html>
